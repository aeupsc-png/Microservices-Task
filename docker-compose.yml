services:
  user-service:
    build:
      context: ./Microservices/user-service
    ports:
      - "3000:3000"
    networks:
      - microservices-net

  product-service:
    build:
      context: ./Microservices/product-service
    ports:
      - "3001:3001"
    networks:
      - microservices-net

  order-service:
    build:
      context: ./Microservices/order-service
    ports:
      - "3002:3002"
    networks:
      - microservices-net

  gateway-service:
    build:
      context: ./Microservices/gateway-service
    ports:
      - "3003:3003"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
